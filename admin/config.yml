backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "homepage"
    label: "Homepage Content"
    files:
      - name: "ministry"
        label: "Ministry / Mission Section"
        file: "content/homepage/ministry.json"
        format: "json"
        fields:
          - { label: "Intro Paragraph", name: "intro", widget: "text" }
          - { label: "Emphasis Line (bold callout below intro)", name: "emphasis", widget: "text" }

      - name: "bio"
        label: "About Tim / Bio Section"
        file: "content/homepage/bio.json"
        format: "json"
        fields:
          - { label: "Bio Photo", name: "photo", widget: "image" }
          - label: "Bio Paragraphs"
            name: "paragraphs"
            widget: "list"
            summary: "{{fields.text}}"
            field: { label: "Paragraph", name: "text", widget: "text" }

  - name: "sermons"
    label: "Sermons"
    folder: "content/sermons"
    create: true
    delete: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    format: "json"
    extension: "json"
    summary: "{{title}} — {{church}}"
    fields:
      - { label: "Date Preached", name: "date", widget: "datetime", format: "YYYY-MM-DD", picker_utc: true }
      - { label: "Thumbnail Image", name: "image", widget: "image" }
      - { label: "Church Name", name: "church", widget: "string" }
      - { label: "Location (City, State)", name: "location", widget: "string" }
      - { label: "Sermon Title", name: "title", widget: "string" }
      - { label: "Scripture Reference", name: "scripture", widget: "string", required: false, hint: "e.g. Romans 1:15–17. Leave blank if none." }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Video URL", name: "videoUrl", widget: "string", required: false, hint: "Link to YouTube, Facebook, etc. Leave blank if no video yet." }

  - name: "resources"
    label: "Resources"
    folder: "content/resources"
    create: true
    delete: true
    slug: "{{slug}}"
    format: "json"
    extension: "json"
    summary: "{{title}}"
    fields:
      - { label: "Cover Image", name: "image", widget: "image" }
      - label: "Cover Shape"
        name: "coverType"
        widget: "select"
        options: ["book", "square"]
        default: "square"
        hint: "Use 'book' for tall book covers, 'square' for square graphics."
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Author", name: "author", widget: "string", default: "Tim Marrow" }
      - { label: "Description", name: "description", widget: "text" }
